<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>

    <style>
        .image-container {
            justify-content:center;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .image-container img {
            width: 200px;
            height: 150px;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <h1>My Image Gallery</h1>

    <div class="image-container">

        <img src="EWCC1276.JPG" alt="Image 1">

        <img src="EWMH5766.JPEG" alt="Image 2">

        <img src="LKJD7968.JPG" alt="Image 3">

        <img src="OQSG3379.JPG" alt="Image 4">

    
    </div>

</body>
</html>
